name: All Tests and Reports

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt openpyxl

      - name: Install Node tooling
        run: |
          npm install selenium-webdriver webdriverio

      - name: Run Selenium test summary generator
        run: |
          python selenium-tests/generate_test_summary.py

      - name: Run Appium test summary generator
        run: |
          python appium-tests/generate_test_summary.py

      - name: Run security report generator
        run: |
          python scripts/generate_security_reports.py

      - name: Run load test summary generator
        run: |
          python load_test.py > load-test-output.txt || true

      - name: Prepare artifacts directory
        run: |
          mkdir -p artifacts
          cp -f selenium-tests/test-summary.xlsx artifacts/ || true
          cp -f appium-tests/appium-test-summary.xlsx artifacts/ || true
          cp -f "Vulnerability Test Results/findings.xlsx" artifacts/ || true
          cp -f "Vulnerability Test Results/endpoint-inventory.xlsx" artifacts/ || true
          cp -f "Vulnerability Test Results/security-review.md" artifacts/ || true
          cp -f load-test-output.txt artifacts/ || true

      - name: Publish GitHub Action summary
        run: |
          echo "## Test Report Bundle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Selenium report: selenium-tests/test-summary.xlsx" >> $GITHUB_STEP_SUMMARY
          echo "- Appium report: appium-tests/appium-test-summary.xlsx" >> $GITHUB_STEP_SUMMARY
          echo "- Security reports: Vulnerability Test Results/" >> $GITHUB_STEP_SUMMARY
          echo "- Load test output: load-test-output.txt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts were uploaded as 'all-test-reports'." >> $GITHUB_STEP_SUMMARY

      - name: Upload all test reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: artifacts/
          if-no-files-found: warn
