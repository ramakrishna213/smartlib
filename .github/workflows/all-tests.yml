name: All Tests and Reports

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest Appium-Python-Client openpyxl

      - name: Install Node dependencies
        run: |
          cd automation
          npm install
          cd ../selenium_tests
          npm install

      - name: Start Flask app for Selenium checks
        run: |
          python app.py > /tmp/smartlib.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:5000/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -I http://127.0.0.1:5000/ || true

      - name: Run Appium pytest suite
        run: |
          python -m pytest appium_tests/tests/test_smartlib_appium.py -q
        continue-on-error: true

      - name: Generate Appium report artifact
        run: |
          mkdir -p appium_tests/reports
          python appium_tests/run_appium_tests.py --demo --output appium_tests/reports/appium_e2e_report.xlsx

      - name: Run Selenium E2E suite
        env:
          BASE_URL: http://127.0.0.1:5000
        run: |
          cd selenium_tests
          npm test
        continue-on-error: true

      - name: Run security report generator
        run: |
          python scripts/generate_security_reports.py

      - name: Run load test summary generator
        run: |
          python load_test.py > load-test-output.txt || true

      - name: Prepare artifacts directory
        run: |
          mkdir -p artifacts
          cp -f selenium_tests/reports/selenium_e2e_report.xlsx artifacts/ || true
          cp -f appium_tests/reports/appium_e2e_report.xlsx artifacts/ || true
          cp -f "Vulnerability Test Results/findings.xlsx" artifacts/ || true
          cp -f "Vulnerability Test Results/endpoint-inventory.xlsx" artifacts/ || true
          cp -f "Vulnerability Test Results/security-review.md" artifacts/ || true
          cp -f load-test-output.txt artifacts/ || true

      - name: Publish GitHub Action summary
        run: |
          echo "## Test Report Bundle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Selenium report: selenium_tests/reports/selenium_e2e_report.xlsx" >> $GITHUB_STEP_SUMMARY
          echo "- Appium report: appium_tests/reports/appium_e2e_report.xlsx" >> $GITHUB_STEP_SUMMARY
          echo "- Security reports: Vulnerability Test Results/" >> $GITHUB_STEP_SUMMARY
          echo "- Load test output: load-test-output.txt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts were uploaded as 'all-test-reports'." >> $GITHUB_STEP_SUMMARY

      - name: Upload all test reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: artifacts/
          if-no-files-found: warn
