name: Appium Mobile Tests

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'appium_tests/**'
      - 'requirements.txt'
      - '.github/workflows/appium-tests.yml'
  pull_request:
    paths:
      - 'appium_tests/**'
      - 'requirements.txt'
      - '.github/workflows/appium-tests.yml'

jobs:
  appium:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Appium test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r appium_tests/requirements.txt pytest

      - name: Run Appium pytest suite
        run: |
          python -m pytest appium_tests/tests/test_smartlib_appium.py -q
        continue-on-error: true

      - name: Generate Appium report
        run: |
          python appium_tests/run_appium_tests.py --demo --output appium_tests/reports/appium_e2e_report.xlsx || true
