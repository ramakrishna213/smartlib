name: Baseline Test Cases

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '**/*.py'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/baseline-tests.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/baseline-tests.yml'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start application
        run: |
          python app.py > /tmp/smartlib.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:5000/ >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Run baseline smoke checks
        run: |
          python - <<'PY'
          import urllib.request
          paths = ['/', '/login', '/register']
          for path in paths:
              with urllib.request.urlopen(f'http://127.0.0.1:5000{path}', timeout=15) as response:
                  print(path, response.status)
          PY
