name: Security Review

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt semgrep pip-audit openpyxl

      - name: Detect backend technology
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          text = Path('requirements.txt').read_text(encoding='utf-8', errors='ignore')
          print('backend=flask' if 'flask' in text.lower() else 'backend=unknown')
          print('language=python')
          PY

      - name: Run Semgrep SAST
        run: |
          semgrep --config=auto --json . > semgrep-report.json || true

      - name: Run dependency audit
        run: |
          pip-audit -r requirements.txt --format json > pip-audit-report.json || true

      - name: Generate reports
        run: |
          python scripts/generate_security_reports.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            Vulnerability Test Results/
            semgrep-report.json
            pip-audit-report.json

      - name: Publish GitHub summary
        run: |
          echo "## Security Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- SAST scan completed with Semgrep" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency audit completed with pip-audit" >> $GITHUB_STEP_SUMMARY
          echo "- Reports generated in Vulnerability Test Results/" >> $GITHUB_STEP_SUMMARY
