name: Backend Security Review

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt semgrep pip-audit openpyxl

      - name: Detect backend stack
        run: |
          python security_audit/backend_inventory.py

      - name: Generate 400+ structured test cases
        run: |
          python security_audit/generate_test_cases.py

      - name: Generate reports and workbook artifacts
        run: |
          python security_audit/generate_reports.py
          python security_audit/generate_load_tests.py

      - name: Run Semgrep
        run: |
          semgrep --config=auto --json . > semgrep-report.json || true

      - name: Run dependency audit
        run: |
          pip-audit -r requirements.txt --format json > pip-audit-report.json || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-audit
          path: |
            Vulnerability Test Results/
            semgrep-report.json
            pip-audit-report.json
          retention-days: 30

      - name: Publish GitHub Action summary
        if: always()
        run: |
          echo "# Backend Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Framework detected: Flask / Python" >> $GITHUB_STEP_SUMMARY
          echo "- Inventory report: Vulnerability Test Results/backend-inventory.md" >> $GITHUB_STEP_SUMMARY
          echo "- Security report: Vulnerability Test Results/security-review.md" >> $GITHUB_STEP_SUMMARY
          echo "- Executive summary: Vulnerability Test Results/executive-summary.md" >> $GITHUB_STEP_SUMMARY
          echo "- Test cases: Vulnerability Test Results/test-cases.xlsx" >> $GITHUB_STEP_SUMMARY
