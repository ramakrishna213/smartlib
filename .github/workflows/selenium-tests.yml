name: Selenium UI Tests

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'selenium_tests/**'
      - 'automation/**'
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/selenium-tests.yml'
  pull_request:
    paths:
      - 'selenium_tests/**'
      - 'automation/**'
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/selenium-tests.yml'

jobs:
  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Selenium test dependencies
        run: |
          npm install --prefix selenium_tests

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          echo "CHROME_BIN=$(which google-chrome || which google-chrome-stable)" >> "$GITHUB_ENV"

      - name: Start Flask app
        run: |
          python app.py > /tmp/smartlib.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:5000/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -I http://127.0.0.1:5000/ || true

      - name: Run Selenium tests
        env:
          BASE_URL: http://127.0.0.1:5000
          CHROME_BIN: ${{ env.CHROME_BIN }}
        run: |
          mkdir -p selenium_tests/reports/e2e
          npm test --prefix selenium_tests

      - name: Upload Selenium reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-e2e-reports
          path: selenium_tests/reports/
          if-no-files-found: warn
