{% extends "base.html" %}
{% block content %}
<div class="page">

  <!-- Back -->
  <div style="margin-bottom:16px">
    <a href="{{ url_for('main.settings') }}"
       style="color:#2563eb;font-size:13px;text-decoration:none;
              display:inline-flex;align-items:center;gap:6px">
      <i class="fa-solid fa-arrow-left"></i> Back to Settings
    </a>
  </div>

  <h1 class="page-title">Change Password</h1>
  <p class="page-subtitle">Update your login credentials.</p>

  <div style="margin-top:16px">

    <!-- Security Info -->
    <div style="background:#dbeafe;border:1px solid #bfdbfe;border-radius:12px;
                padding:14px;margin-bottom:16px;display:flex;gap:10px;
                align-items:flex-start">
      <i class="fa-solid fa-shield-halved" style="color:#2563eb;margin-top:2px"></i>
      <div style="font-size:13px;color:#1e40af">
        Choose a strong password with at least 6 characters.
        Your session will remain active after changing.
      </div>
    </div>

    <form method="POST" action="{{ url_for('main.change_password') }}">
      <div class="card">

        <!-- Current Password -->
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <div style="position:relative">
            <input type="password" name="current_password" id="pw1"
                   class="form-control" placeholder="Enter current password"
                   required style="padding-right:44px">
            <button type="button" onclick="togglePw('pw1','eye1')"
                    style="position:absolute;right:14px;top:50%;
                           transform:translateY(-50%);background:none;
                           border:none;color:#9ca3af;cursor:pointer;font-size:16px">
              <i class="fa-regular fa-eye" id="eye1"></i>
            </button>
          </div>
        </div>

        <!-- New Password -->
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div style="position:relative">
            <input type="password" name="new_password" id="pw2"
                   class="form-control" placeholder="Enter new password"
                   required style="padding-right:44px">
            <button type="button" onclick="togglePw('pw2','eye2')"
                    style="position:absolute;right:14px;top:50%;
                           transform:translateY(-50%);background:none;
                           border:none;color:#9ca3af;cursor:pointer;font-size:16px">
              <i class="fa-regular fa-eye" id="eye2"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <div style="position:relative">
            <input type="password" name="confirm_password" id="pw3"
                   class="form-control" placeholder="Confirm new password"
                   required style="padding-right:44px"
                   oninput="checkMatch()">
            <button type="button" onclick="togglePw('pw3','eye3')"
                    style="position:absolute;right:14px;top:50%;
                           transform:translateY(-50%);background:none;
                           border:none;color:#9ca3af;cursor:pointer;font-size:16px">
              <i class="fa-regular fa-eye" id="eye3"></i>
            </button>
          </div>
          <div id="match-msg" style="font-size:12px;margin-top:4px"></div>
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-lock"></i> Change Password
        </button>

      </div>
    </form>

  </div>
</div>

<script>
  function togglePw(id, iconId) {
    const pw   = document.getElementById(id);
    const icon = document.getElementById(iconId);
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.className = 'fa-regular fa-eye-slash';
    } else {
      pw.type = 'password';
      icon.className = 'fa-regular fa-eye';
    }
  }

  function checkMatch() {
    const pw2 = document.getElementById('pw2').value;
    const pw3 = document.getElementById('pw3').value;
    const msg = document.getElementById('match-msg');
    if (pw3.length === 0) {
      msg.textContent = '';
    } else if (pw2 === pw3) {
      msg.textContent = '✅ Passwords match!';
      msg.style.color = '#16a34a';
    } else {
      msg.textContent = '❌ Passwords do not match!';
      msg.style.color = '#ef4444';
    }
  }
</script>
{% endblock %}
