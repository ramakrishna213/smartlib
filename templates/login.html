{% extends "base.html" %}
{% block content %}

<!-- Email -->
<div class="form-group">
  <label class="form-label">Email</label>
  <input type="email" name="email" class="form-control"
         placeholder="Enter your email" required>
</div>

<!-- Password -->
<div class="form-group">
  <label class="form-label">Password</label>
  <div class="pw-wrap">
    <input type="password" name="password" id="pw"
           class="form-control" placeholder="••••••••" required>
    <button type="button" class="pw-toggle" onclick="togglePw()">
      <i class="fa-regular fa-eye" id="eye-icon"></i>
    </button>
  </div>
</div>

<!-- Remember + Forgot -->
<div class="remember-row">
  <label>
    <input type="checkbox" name="remember"> Remember me
  </label>
  <a href="#" class="forgot">Forgot password?</a>
</div>

<button type="submit" class="btn btn-primary">
  Sign In
</button>

<!-- Portal Links -->
<div style="display:flex;gap:8px;margin-top:12px;justify-content:center">
  <a href="{{ url_for('auth.admin_login') }}"
     style="font-size:12px;color:#7c3aed;text-decoration:none;
            padding:6px 12px;border:1px solid #7c3aed;border-radius:8px">
    <i class="fa-solid fa-shield-halved"></i> Admin
  </a>

  <a href="{{ url_for('auth.librarian_login') }}"
     style="font-size:12px;color:#0369a1;text-decoration:none;
            padding:6px 12px;border:1px solid #0369a1;border-radius:8px">
    <i class="fa-solid fa-book-open"></i> Librarian
  </a>
</div>

<!-- signup-row should remain below this -->

<div class="signup-row">
  Don't have an account?
  <a href="{{ url_for('auth.register') }}">Sign Up</a>
</div>
-->

{% endblock %}
