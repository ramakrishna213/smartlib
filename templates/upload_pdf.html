{% extends "base.html" %}
{% block content %}
<div class="page">

  <div style="margin-bottom:16px">
    <a href="{{ url_for('main.book_detail', book_id=book.id) }}"
       style="color:#2563eb;font-size:13px;text-decoration:none;
              display:inline-flex;align-items:center;gap:6px">
      <i class="fa-solid fa-arrow-left"></i> Back to Book
    </a>
  </div>

  <h1 class="page-title">Upload PDF</h1>
  <p class="page-subtitle">Upload PDF file for "{{ book.title }}"</p>

  <div style="margin-top:16px">
    <div class="card">

      <!-- Current PDF Status -->
      {% if book.pdf_file %}
      <div style="background:#dcfce7;border:1px solid #bbf7d0;
                  border-radius:10px;padding:12px;margin-bottom:16px;
                  display:flex;align-items:center;gap:10px">
        <i class="fa-solid fa-circle-check" style="color:#16a34a"></i>
        <div>
          <div style="font-size:13px;font-weight:600;color:#166534">
            PDF already uploaded
          </div>
          <div style="font-size:11px;color:#166534">
            Upload a new file to replace it
          </div>
        </div>
      </div>
      {% endif %}

      <form method="POST"
            action="{{ url_for('main.upload_pdf', book_id=book.id) }}"
            enctype="multipart/form-data">

        <!-- Drop Zone -->
        <div id="drop-zone"
             style="border:2px dashed #2563eb;border-radius:12px;
                    padding:40px 20px;text-align:center;margin-bottom:16px;
                    background:#eff6ff;cursor:pointer"
             onclick="document.getElementById('pdf-input').click()">
          <i class="fa-solid fa-file-pdf"
             style="font-size:48px;color:#2563eb;margin-bottom:12px"></i>
          <div style="font-size:15px;font-weight:600;color:#1e40af;margin-bottom:4px">
            Click to select PDF file
          </div>
          <div style="font-size:12px;color:#6b7280">
            Maximum file size: 50MB
          </div>
          <div id="file-name"
               style="margin-top:10px;font-size:13px;
                      color:#2563eb;font-weight:500"></div>
        </div>

        <input type="file" name="pdf_file" id="pdf-input"
               accept=".pdf" style="display:none"
               onchange="showFileName(this)">

        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-upload"></i> Upload PDF
        </button>

      </form>
    </div>
  </div>
</div>

<script>
  function showFileName(input) {
    const fileName = document.getElementById('file-name');
    const dropZone = document.getElementById('drop-zone');
    if (input.files && input.files[0]) {
      fileName.textContent = '✅ Selected: ' + input.files[0].name;
      dropZone.style.background = '#dcfce7';
      dropZone.style.borderColor = '#16a34a';
    }
  }
</script>
{% endblock %}
